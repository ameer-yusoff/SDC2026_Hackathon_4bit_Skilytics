<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#7A1523"><title>Skilytics · Offline</title>
<style>*{box-sizing:border-box}body{margin:0;background:#faf8f4;color:#281e20;font:16px/1.6 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:100%;max-width:440px;background:white;border:1px solid #e4dada;border-radius:24px;padding:28px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}img{width:64px;height:64px}select,button{min-height:44px;border-radius:12px;padding:8px 14px;font:inherit}select{max-width:50%;background:#fff;border:1px solid #e4dada}h1{font-size:26px;line-height:1.2;margin-top:24px}p{color:#6c5d60}button{width:100%;border:0;background:#7A1523;color:white;font-weight:700;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #c69214;outline-offset:3px}</style></head>
<body><main><header><img src="/pwa/icon-192.png" alt="Skilytics" width="64" height="64"><select id="language" aria-label="Language"><option value="en">English</option><option value="ms">BM</option><option value="zh">中文</option></select></header><h1 id="title"></h1><p id="message"></p><button id="retry" type="button"></button></main>
<script>
const words={en:["You're offline","Connect to the internet to use AI, courses and your workspace. Then try again.","Try again"],ms:["Anda sedang offline","Sambungkan internet untuk menggunakan AI, kursus dan ruang kerja anda. Kemudian cuba lagi.","Cuba lagi"],zh:["目前处于离线状态","连接网络后，即可使用AI、课程和工作区，然后重试。","重试"]};
const select=document.getElementById('language');let lang='en';try{lang=localStorage.getItem('skilytics.lang')||'en'}catch{}if(!words[lang])lang='en';select.value=lang;function render(){const w=words[select.value];document.documentElement.lang=select.value;document.title='Skilytics · '+w[0];select.setAttribute('aria-label',({en:'Language',ms:'Bahasa',zh:'语言'})[select.value]);document.getElementById('title').textContent=w[0];document.getElementById('message').textContent=w[1];document.getElementById('retry').textContent=w[2]}select.addEventListener('change',render);document.getElementById('retry').addEventListener('click',()=>location.reload());render();
</script></body></html>
